name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main", "feature/app-manager-v0.3" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Clean and build debug APK
        run: gradle clean assembleDebug --stacktrace
      - name: Generate APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Verify APK and checksum
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum --check app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload installable debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: mobile-security-inspector-v0.4.1
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
