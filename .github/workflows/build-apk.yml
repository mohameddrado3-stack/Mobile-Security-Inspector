name: Verify Android builds

on:
  workflow_dispatch:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "feature/**", "release/**" ]

concurrency:
  group: msi-verify-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Check runtime dependencies for networking or tracking SDKs
        shell: bash
        run: |
          set -euo pipefail
          gradle app:dependencies --configuration releaseRuntimeClasspath > /tmp/msi-release-deps.txt
          BLOCKED='okhttp3|retrofit2|ktor-client|volley|fuel|apollo-runtime|grpc-okhttp|firebase-analytics|firebase-crashlytics|firebase-messaging|play-services-measurement|sentry|amplitude|mixpanel|appsflyer|adjust-android|onesignal|segment-analytics|posthog|bugsnag|datadog'
          if grep -Eiq "$BLOCKED" /tmp/msi-release-deps.txt; then
            echo "Unexpected network, analytics, or tracking SDK detected in release runtime dependencies" >&2
            grep -Ei "$BLOCKED" /tmp/msi-release-deps.txt >&2
            exit 1
          fi
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug and minified release APKs
        run: gradle clean assembleDebug assembleRelease --stacktrace
      - name: Verify release manifest and minification outputs
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          test -s "app/build/outputs/mapping/release/mapping.txt"
          ANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          test -n "$ANALYZER"
          TARGET_SDK="$("$ANALYZER" manifest target-sdk "$APK")"
          VERSION_NAME="$("$ANALYZER" manifest version-name "$APK")"
          VERSION_CODE="$("$ANALYZER" manifest version-code "$APK")"
          DEBUGGABLE="$("$ANALYZER" manifest debuggable "$APK")"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEBUG_FLAG="$("$ANALYZER" manifest debuggable "$DEBUG_APK")"
          PERMISSIONS="$("$ANALYZER" manifest permissions "$APK")"
          DEBUG_PERMISSIONS="$("$ANALYZER" manifest permissions "$DEBUG_APK")"
          MANIFEST_FILE="/tmp/msi-release-manifest.xml"
          "$ANALYZER" manifest print "$APK" > "$MANIFEST_FILE"
          test "$TARGET_SDK" -ge 36
          test "$VERSION_NAME" = "0.8.0"
          test "$VERSION_CODE" -eq 11
          test "$DEBUG_FLAG" = "true"
          if [ "$DEBUGGABLE" != "false" ]; then
            echo "Release APK must not be debuggable (actual: $DEBUGGABLE)" >&2
            exit 1
          fi
          if ! printf '%s\n' "$PERMISSIONS" | grep -Fxq 'android.permission.INTERNET'; then
            echo "Update Center requires INTERNET permission in Release" >&2
            exit 1
          fi
          if printf '%s\n' "$DEBUG_PERMISSIONS" | grep -q 'android.permission.INTERNET'; then
            echo "Unexpected INTERNET permission in Debug APK" >&2
            exit 1
          fi
          if ! printf '%s\n' "$PERMISSIONS" | grep -Fxq 'android.permission.FOREGROUND_SERVICE'; then
            echo "Missing base foreground service permission in Release" >&2
            exit 1
          fi
          if ! printf '%s\n' "$PERMISSIONS" | grep -Fxq 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE'; then
            echo "Missing special-use foreground service permission in Release" >&2
            exit 1
          fi
          if ! grep -q 'api.github.com/repos/mohameddrado3-stack/Mobile-Security-Inspector/releases/latest' app/src/main/java/com/msi/inspector/data/updates/GitHubReleaseChecker.kt; then
            echo "Expected fixed GitHub release endpoint was not found" >&2
            exit 1
          fi
          if grep -q 'PreviewActivity' "$MANIFEST_FILE"; then
            echo "Unexpected PreviewActivity in release APK" >&2
            exit 1
          fi
          python - "$MANIFEST_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          manifest = ET.parse(sys.argv[1]).getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          package_name = manifest.get("package", "com.msi.inspector")
          allowed_exported = {package_name + ".MainActivity"}
          protected_framework_services = {
              ("androidx.glance.appwidget.GlanceRemoteViewsService", "android.permission.BIND_REMOTEVIEWS"),
              ("androidx.work.impl.background.systemjob.SystemJobService", "android.permission.BIND_JOB_SERVICE"),
              ("androidx.work.impl.diagnostics.DiagnosticsReceiver", "android.permission.DUMP"),
              ("androidx.profileinstaller.ProfileInstallReceiver", "android.permission.DUMP")
          }
          def normalize_name(name):
              if name.startswith("."):
                  return package_name + name
              if "." not in name:
                  return package_name + "." + name
              return name
          monitor_service = None
          for service in manifest.findall("./application/service"):
              if normalize_name(service.get(ns + "name", "")) == package_name + ".background.MsiMonitoringService":
                  monitor_service = service
                  break
          if monitor_service is None:
              raise SystemExit("Active monitoring foreground service is missing")
          if monitor_service.get(ns + "exported", "false").lower() != "false":
              raise SystemExit("Active monitoring service must not be exported")
          foreground_service_type = monitor_service.get(ns + "foregroundServiceType", "").strip()
          has_special_use = "specialUse" in foreground_service_type
          if not has_special_use:
              try:
                  has_special_use = (int(foreground_service_type, 0) & 0x40000000) != 0
              except ValueError:
                  has_special_use = False
          if not has_special_use:
              raise SystemExit(
                  "Active monitoring service must declare specialUse "
                  f"(manifest value: {foreground_service_type!r})"
              )
          subtype = monitor_service.find("property")
          if subtype is None or subtype.get(ns + "name") != "android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE":
              raise SystemExit("Active monitoring service special-use purpose is missing")
          for tag in ("activity", "activity-alias", "service", "receiver", "provider"):
              for component in manifest.findall(f"./application/{tag}"):
                  exported = component.get(ns + "exported", "false").lower() == "true"
                  if exported:
                      name = normalize_name(component.get(ns + "name", ""))
                      if name in allowed_exported:
                          continue
                      permission = component.get(ns + "permission", "")
                      if tag in ("service", "receiver") and (name, permission) in protected_framework_services:
                          continue
                      raise SystemExit(f"Unexpected exported component or missing protected permission: {tag} {name} permission={permission}")
          PY
          if unzip -p "$APK" 'classes*.dex' | strings | grep -q 'kotlinx.coroutines.debug.DebugProbes'; then
            echo "DebugProbes must not be packaged in Release" >&2
            exit 1
          fi
          echo "Release manifest verified: versionName=$VERSION_NAME versionCode=$VERSION_CODE targetSdk=$TARGET_SDK debuggable=$DEBUGGABLE; restricted GitHub release-check networking, non-exported special-use monitoring service, no PreviewActivity, unexpected exported components, or DebugProbes."
          echo "Debug manifest verified: debuggable=$DEBUG_FLAG."
          stat -c 'Debug APK bytes: %s' "$DEBUG_APK"
          stat -c 'Release APK bytes: %s' "$APK"
      - name: Generate and verify checksums
        run: |
          cd app/build/outputs/apk
          sha256sum debug/app-debug.apk release/app-release-unsigned.apk > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload debug and unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-security-inspector-v0.8.0-verification
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/SHA256SUMS.txt
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
