name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main", "feature/app-manager-v0.3" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Clean and build debug APK
        run: gradle clean assembleDebug --stacktrace
      - name: Verify embedded PRoot runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/msi-native-check
          unzip -p app/build/outputs/apk/debug/app-debug.apk lib/arm64-v8a/libproot-static.so > /tmp/msi-native-check/libproot-static.so
          unzip -p app/build/outputs/apk/debug/app-debug.apk lib/arm64-v8a/libproot-static-loader.so > /tmp/msi-native-check/libproot-static-loader.so
          printf '%s  %s\\n' 'fa10b1a7818c2f5b1dcb5834450570c368c9ecf66d31521509621b95c4538a45' '/tmp/msi-native-check/libproot-static.so' | sha256sum --check
          printf '%s  %s\\n' '51c3427b112edc70d1979b48209c41f332616758138de3be659cc79e50436450' '/tmp/msi-native-check/libproot-static-loader.so' | sha256sum --check
      - name: Generate APK checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
      - name: Verify APK and checksum
        run: |
          cd app/build/outputs/apk/debug
          test -s app-debug.apk
          sha256sum --check SHA256SUMS.txt
      - name: Upload installable debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: mobile-security-inspector-v0.5.0-alpha02
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
