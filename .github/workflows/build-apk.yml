name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main", "feature/**" ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace
      - name: Generate APK checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
      - name: Verify APK and checksum
        run: |
          cd app/build/outputs/apk/debug
          test -s app-debug.apk
          sha256sum --check SHA256SUMS.txt
      - name: Upload installable debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: mobile-security-inspector-v0.5.0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
